<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Experiment 1.1.1</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <form class="form-box">
        <h1><b>Student Registration</b></h1>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" required pattern="[A-Za-z ]{3,}"><br><br>
        </div>
        <div class="form-group">
            <label for="email">Email ID</label>
            <input type="email" name="email" required><br><br>
        </div>
        <div class="form-group">
            <label for="Age">Age</label>
            <input type="number" name="age" id="Age" required min="1" max="100"><br><br>
        </div>

        <input type="submit" value="Register">
    </form>
</body>

</html>
